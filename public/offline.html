<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — ShaadiRent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4c0519 0%, #1c1917 100%);
      color: #fdf2f8;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(233, 178, 74, 0.3);
      padding: 40px 24px;
      border-radius: 28px;
      max-width: 400px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
      display: block;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 24px;
      color: #e9b24a;
      margin-bottom: 10px;
      font-weight: bold;
    }
    p {
      color: #e7e5e4;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #e9b24a, #d97706);
      color: #1c1917;
      border: none;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    button:hover {
      transform: scale(1.03);
      opacity: 0.95;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">💍</span>
    <h1>You are Offline</h1>
    <p>Please check your mobile data or Wi-Fi connection to explore wedding couture on ShaadiRent.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
